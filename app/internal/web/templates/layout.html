<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SpotKeeper · Twoje miejsce w lochu czeka</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg?v={{.IconV}}">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="theme-color" content="#18181c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f3" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpotKeeper">
<link rel="stylesheet" href="/static/app.css?v={{.CSSV}}">
<script src="/static/app.js?v={{.JSV}}"></script>
</head>
<body{{if not .User}} class="auth"{{end}}>
<header class="topbar">
<a class="brand" href="/" aria-label="SpotKeeper — strona główna"><img class="logo" src="/static/logo.svg?v={{.LogoV}}" alt="" width="32" height="32"><span class="wordmark"><span class="wm-fart">Spot</span><span class="wm-cash">Keeper</span></span><span class="muted tagline">Twoje miejsce w lochu czeka</span></a>
<div class="topbar-actions">
<a class="help-link" href="/pomoc">Pomoc</a>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Motyw: systemowy (zmień)" title="Motyw: systemowy"><svg class="i-sys" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
{{if .User}}<span class="user" title="{{.User}}">{{.User}}</span>{{end}}
{{if .User}}<form method="post" action="/logout"><button type="submit" class="btn" aria-label="Wyloguj" title="Wyloguj">{{icon "logout"}}<span class="btn-label">Wyloguj</span></button></form>{{end}}
</div>
</header>
<main class="{{if or .User .Wide}}shell{{else}}auth-main{{end}}">
{{template "content" .}}
</main>
<footer class="footer">Nieoficjalny klient · MIT</footer>
<div class="toasts" id="toasts" role="status" aria-live="polite">{{if .FlashOK}}<div class="toast" data-autohide="3000"><span>{{.FlashOK}}</span><button type="button" class="toast-close" data-dismiss aria-label="Zamknij">×</button></div>{{end}}</div>
</body>
</html>
